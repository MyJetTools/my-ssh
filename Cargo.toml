[package]
name = "my-ssh"
version = "0.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
russh = { version = "*", features = ["async-trait"] }
russh-sftp = "*"
# Pin pre-release to match russh's transitive expectations
# (pkcs8 0.11.0-rc.X expects pkcs5 0.8.0-rc.X API; the stable 0.8.0 broke it)
pkcs5 = "=0.8.0-rc.13"
tokio = { version = "*", features = [
    "sync",
    "fs",
    "net",
    "io-util",
    "rt",
    "rt-multi-thread",
    "time",
    "macros",
] }
rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git" }
futures = "*"
serde = "*"
lazy_static = "*"
async-trait = "*"
